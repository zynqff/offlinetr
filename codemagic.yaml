workflows:

   build-app-unsigned-ipa:
    name: Build LocalTranslator unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $HOME/.cache/llama-cpp
        - $CM_BUILD_DIR/.build/llama.cpp

    scripts:

      - name: Ensure llama.xcframework is present in Vendor/
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          VENDOR_FW="$ROOT/Vendor/llama.xcframework"

          if [ -d "$VENDOR_FW/ios-arm64/llama.framework" ]; then
            echo "llama.xcframework уже лежит в Vendor/, пересборка не нужна."
            exit 0
          fi

          echo "llama.xcframework не найден в Vendor/, собираю из исходников..."
          LLAMA_DIR="$ROOT/.build/llama.cpp"
          COMMIT="b10507"
          mkdir -p "$ROOT/.build"
          if [ ! -d "$LLAMA_DIR/.git" ]; then
            git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$LLAMA_DIR"
          fi
          cd "$LLAMA_DIR"
          git fetch --depth 1 origin "$COMMIT"
          git checkout --detach "$COMMIT"
          chmod +x ./build-xcframework.sh
          ./build-xcframework.sh ios-device

          rm -rf "$VENDOR_FW"
          mkdir -p "$ROOT/Vendor"
          cp -R "$LLAMA_DIR/build-apple/llama.xcframework" "$VENDOR_FW"

      - name: Build LocalTranslator.app (без подписи)
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          BUILD_DIR="$ROOT/build/Release-iphoneos"

          xcodebuild build \
            -project "$ROOT/LocalTranslator.xcodeproj" \
            -target LocalTranslator \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            FRAMEWORK_SEARCH_PATHS="$ROOT/Vendor" \
            OTHER_LDFLAGS="-framework llama" \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks'

          APP_PATH="$BUILD_DIR/LocalTranslator.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$CM_ENV"

      - name: Упаковать unsigned .ipa
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          OUT="$ROOT/build"

          mkdir -p "$OUT/Payload"

          cp -R "$APP_PATH" "$OUT/Payload/LocalTranslator.app"

          mkdir -p "$OUT/Payload/LocalTranslator.app/Frameworks"
          cp -R "$ROOT/Vendor/llama.xcframework/ios-arm64/llama.framework" \
                "$OUT/Payload/LocalTranslator.app/Frameworks/"

          cd "$OUT"
          zip -r -y "LocalTranslator-unsigned.ipa" Payload

          echo "=== Готово ==="
          ls -lh "$OUT/LocalTranslator-unsigned.ipa"

    artifacts:
      - build/LocalTranslator-unsigned.ipa
