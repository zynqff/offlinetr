workflows:
  ios-release:
    name: LocalTranslator iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: ${BUNDLE_ID}

      vars:
        BUNDLE_ID: "ТВОЙ_BUNDLE_ID"
        XCODE_PROJECT: "LocalTranslator.xcodeproj"
        XCODE_SCHEME: "LocalTranslator"

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $HOME/Library/Developer/Xcode/DerivedData
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      - name: Show build environment
        script: |
          set -e
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package dependencies
        script: |
          set -e
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies

      - name: Apply Codemagic signing
        script: |
          set -e
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
