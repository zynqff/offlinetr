workflows:
  build-app-unsigned-ipa:
    name: Build LocalTranslator unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Ensure llama.xcframework is present in Vendor/
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          VENDOR_FW="$ROOT/Vendor/llama.xcframework"

          if [ -d "$VENDOR_FW/ios-arm64/llama.framework" ]; then
            echo "llama.xcframework уже лежит в Vendor/, пересборка не нужна."
            exit 0
          fi

          echo "ОШИБКА: Vendor/llama.xcframework не найден."
          echo "Положите готовый iOS-device XCFramework в:"
          echo "  $VENDOR_FW"
          echo "Сборка llama.cpp в этом workflow отключена."
          exit 1

      - name: Verify llama.xcframework
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          XCFW="$ROOT/Vendor/llama.xcframework"
          FW="$XCFW/ios-arm64/llama.framework"

          test -d "$FW"
          test -f "$FW/llama"
          test -f "$FW/Modules/module.modulemap"

          echo "=== XCFramework slices ==="
          find "$XCFW" -maxdepth 1 -mindepth 1 -type d -print | sort

          echo "=== Framework ==="
          find "$FW" -maxdepth 2 -type f -print | sort

          echo "=== Binary ==="
          file "$FW/llama"

          if find "$XCFW" -maxdepth 1 -type d \
              \( -name '*simulator*' -o -name 'macos*' -o -name 'xros*' -o -name 'tvos*' \) \
              | grep -q .; then
            echo "ОШИБКА: найдена лишняя платформа в llama.xcframework."
            exit 1
          fi

          echo "OK: используется только iOS Device / arm64."

      - name: Build LocalTranslator.app (без подписи)
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          BUILD_DIR="$ROOT/build/Release-iphoneos"
          XCFW="$ROOT/Vendor/llama.xcframework"
          FW="$XCFW/ios-arm64/llama.framework"
          MODMAP="$FW/Modules/module.modulemap"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          echo "=== module.modulemap ==="
          cat "$MODMAP"

          echo "=== Headers ==="
          find "$FW/Headers" -maxdepth 1 -type f -print

          # ВАЖНО:
          # linker должен видеть каталог, где физически находится llama.framework.
          # Он вложен в Vendor/llama.xcframework/ios-arm64, а не непосредственно в Vendor.
          FRAMEWORK_PATHS="$ROOT/Vendor:$ROOT/Vendor/llama.xcframework/ios-arm64"

          xcodebuild build \
            -project "$ROOT/LocalTranslator.xcodeproj" \
            -target LocalTranslator \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            FRAMEWORK_SEARCH_PATHS="$FRAMEWORK_PATHS" \
            HEADER_SEARCH_PATHS="$FW/Headers" \
            OTHER_SWIFT_FLAGS="-Xcc -fmodule-map-file=$MODMAP -Xcc -I$FW/Headers" \
            OTHER_LDFLAGS="-framework llama" \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks'

          APP_PATH="$BUILD_DIR/LocalTranslator.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$CM_ENV"

      - name: Embed llama.framework into app bundle
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          FW="$ROOT/Vendor/llama.xcframework/ios-arm64/llama.framework"

          test -d "$APP_PATH"
          test -d "$FW"

          mkdir -p "$APP_PATH/Frameworks"
          rm -rf "$APP_PATH/Frameworks/llama.framework"
          cp -R "$FW" "$APP_PATH/Frameworks/llama.framework"

          echo "=== Embedded frameworks ==="
          find "$APP_PATH/Frameworks" -maxdepth 2 -print

      - name: Verify unsigned app
        script: |
          set -euo pipefail

          test -d "$APP_PATH"
          test -d "$APP_PATH/Frameworks/llama.framework"
          test -f "$APP_PATH/Frameworks/llama.framework/llama"

          echo "=== App ==="
          ls -ld "$APP_PATH"

          echo "=== llama.framework ==="
          ls -lh "$APP_PATH/Frameworks/llama.framework/llama"

          echo "=== Code signature status ==="
          codesign -dvv "$APP_PATH" 2>&1 || true

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          OUT="$ROOT/build"

          rm -rf "$OUT/Payload"
          mkdir -p "$OUT/Payload"

          cp -R "$APP_PATH" "$OUT/Payload/LocalTranslator.app"

          cd "$OUT"
          rm -f "LocalTranslator-unsigned.ipa"
          zip -r -y "LocalTranslator-unsigned.ipa" Payload

          echo "=== Готово ==="
          ls -lh "$OUT/LocalTranslator-unsigned.ipa"

    artifacts:
      - build/LocalTranslator-unsigned.ipa
