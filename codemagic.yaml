workflows:
  build-app-unsigned-ipa:
    name: Build LocalTranslator + native Q2_0C Metal
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events: [push, tag]
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Fetch llama.cpp PR #19357 and apply native Q2_0C Metal patch
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          "$ROOT/Scripts/patch_q2_0c_metal.sh"

      - name: Build llama.cpp iOS arm64 static libs with embedded Metal
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          LLAMA="$ROOT/.build/llama.cpp"
          BUILD="$LLAMA/build-apple"

          rm -rf "$BUILD"

          cmake -S "$LLAMA" -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_METAL_TARGET_OS=ios \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF

          cmake --build "$BUILD" --config Release --target llama -j2

          echo "Static libs produced:"
          find "$BUILD" -name '*.a' | sort

      - name: Assemble XCFramework (ios-arm64/libllama.a + Headers)
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          LLAMA="$ROOT/.build/llama.cpp"
          BUILD="$LLAMA/build-apple"
          OUT="$ROOT/build"

          rm -rf "$OUT"
          mkdir -p "$OUT/archive" "$OUT/headers"

          # Собираем все статические архивы (llama + все варианты ggml),
          # которые реально сгенерировал cmake для этой конфигурации.
          LIBS=()
          while IFS= read -r lib; do
            LIBS+=("$lib")
          done < <(find "$BUILD" -name '*.a')

          test "${#LIBS[@]}" -gt 0 || {
            echo "ERROR: No static libraries found under $BUILD"
            exit 1
          }

          OBJECT_DIR="$OUT/objects"
          rm -rf "$OBJECT_DIR"
          mkdir -p "$OBJECT_DIR"
          for lib in "${LIBS[@]}"; do
            name="$(basename "$lib" .a)"
            mkdir -p "$OBJECT_DIR/$name"
            (cd "$OBJECT_DIR/$name" && ar -x "$lib")
          done

          # ВАЖНО: итоговый файл называется именно libllama.a — так его
          # находит -lllama на шаге сборки самого приложения.
          find "$OBJECT_DIR" -type f -name '*.o' -print0 |
            xargs -0 libtool -static -o "$OUT/archive/libllama.a"

          test -s "$OUT/archive/libllama.a"

          cp -R "$LLAMA/include/." "$OUT/headers/"
          if [ -d "$LLAMA/ggml/include" ]; then
            mkdir -p "$OUT/headers/ggml"
            cp -R "$LLAMA/ggml/include/." "$OUT/headers/ggml/"
          fi

          cat > "$OUT/headers/module.modulemap" <<'EOF'
          module llama {
              header "llama.h"
              export *
          }
          EOF

          test -f "$OUT/headers/llama.h"

          rm -rf "$OUT/llama.xcframework"
          xcodebuild -create-xcframework \
            -library "$OUT/archive/libllama.a" \
            -headers "$OUT/headers" \
            -output "$OUT/llama.xcframework"

          test -f "$OUT/llama.xcframework/ios-arm64/libllama.a"

          rm -rf "$ROOT/Vendor/llama.xcframework"
          mkdir -p "$ROOT/Vendor"
          cp -R "$OUT/llama.xcframework" "$ROOT/Vendor/llama.xcframework"

          # xcodebuild -create-xcframework иногда сам перегенерирует
          # module.modulemap для слайса с заголовками и может подменить
          # наш "плоский" module на "framework module" + "umbrella header".
          # Поэтому принудительно перезаписываем файл ПОСЛЕ -create-xcframework
          # и ПОСЛЕ копирования в Vendor/ — это последняя точка перед сборкой
          # приложения, ничего больше modulemap не трогает.
          FINAL_MODMAP="$ROOT/Vendor/llama.xcframework/ios-arm64/Headers/module.modulemap"
          cat > "$FINAL_MODMAP" <<'EOF'
          module llama {
              header "llama.h"
              export *
          }
          EOF
          echo "=== Финальный module.modulemap (после create-xcframework) ==="
          cat "$FINAL_MODMAP"

      - name: Verify Q2_0C Metal source and generated framework
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          SRC="$ROOT/.build/llama.cpp/ggml/src/ggml-metal/ggml-metal.metal"
          XCFW="$ROOT/Vendor/llama.xcframework"
          grep -q 'kernel_mul_mv_q2_0c_f32' "$SRC"
          grep -q 'GGML_TYPE_Q2_0C' "$ROOT/.build/llama.cpp/ggml/src/ggml-metal/ggml-metal-ops.cpp"
          test -f "$XCFW/ios-arm64/libllama.a"
          test -f "$XCFW/ios-arm64/Headers/llama.h"

          echo "=== module.modulemap на этом этапе ==="
          cat "$XCFW/ios-arm64/Headers/module.modulemap"
          if grep -q 'framework module' "$XCFW/ios-arm64/Headers/module.modulemap"; then
            echo "ОШИБКА: module.modulemap снова в форме 'framework module' — что-то его перезаписывает."
            exit 1
          fi

          echo 'Native Q2_0C Metal source is present and XCFramework was generated.'

      - name: Build LocalTranslator.app unsigned
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          BUILD_DIR="$ROOT/build/Release-iphoneos"
          XCFW="$ROOT/Vendor/llama.xcframework"
          LIB_DIR="$XCFW/ios-arm64"
          HDRS="$LIB_DIR/Headers"
          MODMAP="$HDRS/module.modulemap"
          rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
          xcodebuild build \
            -project "$ROOT/LocalTranslator.xcodeproj" \
            -target LocalTranslator \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            HEADER_SEARCH_PATHS="$HDRS" \
            LIBRARY_SEARCH_PATHS="$LIB_DIR" \
            OTHER_SWIFT_FLAGS="-Xcc -fmodule-map-file=$MODMAP -Xcc -I$HDRS" \
            OTHER_LDFLAGS="-lllama -lc++ -framework Accelerate"
          test -d "$BUILD_DIR/LocalTranslator.app"
          echo "APP_PATH=$BUILD_DIR/LocalTranslator.app" >> "$CM_ENV"

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          ROOT="$CM_BUILD_DIR"
          OUT="$ROOT/build"
          rm -rf "$OUT/Payload" && mkdir -p "$OUT/Payload"
          cp -R "$APP_PATH" "$OUT/Payload/LocalTranslator.app"
          cd "$OUT"
          zip -r -y LocalTranslator-unsigned.ipa Payload >/dev/null
    artifacts:
      - build/LocalTranslator-unsigned.ipa
      - Vendor/llama.xcframework
