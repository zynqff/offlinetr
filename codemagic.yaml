workflows:
  build-app-unsigned-ipa:
    name: Build LocalTranslator unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Ensure llama.xcframework is present in Vendor/
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          XCFW="$ROOT/Vendor/llama.xcframework"

          if [ -f "$XCFW/ios-arm64/libllama_combined.a" ] && [ -f "$XCFW/ios-arm64/Headers/llama.h" ]; then
            echo "llama.xcframework (статическая сборка) уже лежит в Vendor/, пересборка не нужна."
            exit 0
          fi

          echo "ОШИБКА: Vendor/llama.xcframework (статический, libllama_combined.a) не найден."
          echo "Положите готовый iOS-device XCFramework в:"
          echo "  $XCFW"
          echo "Ожидается структура:"
          echo "  $XCFW/ios-arm64/libllama_combined.a"
          echo "  $XCFW/ios-arm64/Headers/*.h"
          echo "  $XCFW/ios-arm64/Headers/module.modulemap"
          echo "Сборка llama.cpp в этом workflow отключена."
          exit 1

      - name: Verify llama.xcframework
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          XCFW="$ROOT/Vendor/llama.xcframework"
          LIB="$XCFW/ios-arm64/libllama_combined.a"
          HDRS="$XCFW/ios-arm64/Headers"

          test -f "$LIB"
          test -f "$HDRS/llama.h"
          test -f "$HDRS/module.modulemap"

          echo "=== XCFramework slices ==="
          find "$XCFW" -maxdepth 1 -mindepth 1 -type d -print | sort

          echo "=== Headers ==="
          find "$HDRS" -maxdepth 1 -type f -print | sort

          echo "=== module.modulemap ==="
          cat "$HDRS/module.modulemap"

          echo "=== Binary ==="
          file "$LIB"
          ls -lh "$LIB"

          if find "$XCFW" -maxdepth 1 -type d \
              \( -name '*simulator*' -o -name 'macos*' -o -name 'xros*' -o -name 'tvos*' \) \
              | grep -q .; then
            echo "ОШИБКА: найдена лишняя платформа в llama.xcframework."
            exit 1
          fi

          echo "OK: используется только iOS Device / arm64, статическая линковка."

      - name: Build LocalTranslator.app (без подписи)
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          BUILD_DIR="$ROOT/build/Release-iphoneos"
          XCFW="$ROOT/Vendor/llama.xcframework"
          LIB_DIR="$XCFW/ios-arm64"
          HDRS="$LIB_DIR/Headers"
          MODMAP="$HDRS/module.modulemap"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"

          xcodebuild build \
            -project "$ROOT/LocalTranslator.xcodeproj" \
            -target LocalTranslator \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            HEADER_SEARCH_PATHS="$HDRS" \
            LIBRARY_SEARCH_PATHS="$LIB_DIR" \
            OTHER_SWIFT_FLAGS="-Xcc -fmodule-map-file=$MODMAP -Xcc -I$HDRS" \
            OTHER_LDFLAGS="-lllama_combined -lc++ -framework Accelerate"

          APP_PATH="$BUILD_DIR/LocalTranslator.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$CM_ENV"

      - name: Verify unsigned app
        script: |
          set -euo pipefail

          test -d "$APP_PATH"

          echo "=== App ==="
          ls -ld "$APP_PATH"

          echo "=== Проверка, что бинарник содержит символы llama (статически слинкован) ==="
          nm "$APP_PATH/LocalTranslator" 2>/dev/null | grep -c "llama_model_load_from_file" || {
            echo "ОШИБКА: символы llama не найдены в бинарнике — статическая линковка не сработала."
            exit 1
          }

          echo "=== Code signature status ==="
          codesign -dvv "$APP_PATH" 2>&1 || true

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          OUT="$ROOT/build"

          rm -rf "$OUT/Payload"
          mkdir -p "$OUT/Payload"

          cp -R "$APP_PATH" "$OUT/Payload/LocalTranslator.app"

          cd "$OUT"
          rm -f "LocalTranslator-unsigned.ipa"
          zip -r -y "LocalTranslator-unsigned.ipa" Payload

          echo "=== Готово ==="
          ls -lh "$OUT/LocalTranslator-unsigned.ipa"

    artifacts:
      - build/LocalTranslator-unsigned.ipaworkflows:
