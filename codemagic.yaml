workflows:
  ios-build:
    name: LocalTranslator iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

      vars:
        XCODE_PROJECT: "LocalTranslator.xcodeproj"
        XCODE_SCHEME: "LocalTranslator"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    cache:
      cache_paths:
        - $HOME/Library/Developer/Xcode/DerivedData
        - $HOME/Library/Caches/org.swift.swiftpm

    scripts:
      - name: Show build environment
        script: |
          set -e
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        script: |
          set -e
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies

      - name: Build unsigned archive
        script: |
          set -e

          xcodebuild archive \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/LocalTranslator.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

    artifacts:
      - build/LocalTranslator.xcarchive
      - /tmp/xcodebuild_logs/*.log
