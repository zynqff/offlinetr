workflows:
  build-llama-ios-only:
    name: Build llama.xcframework for iPhone and iPad only
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    cache:
      cache_paths:
        - $HOME/.cache/llama-cpp
        - $CM_BUILD_DIR/.build/llama.cpp

    scripts:

      - name: Build iOS-device llama XCFramework only
        script: |
          set -euo pipefail

          ROOT="$CM_BUILD_DIR"
          LLAMA_DIR="$ROOT/.build/llama.cpp"
          COMMIT="b10507"

          mkdir -p "$ROOT/.build"

          if [ ! -d "$LLAMA_DIR/.git" ]; then
            echo "Cloning llama.cpp..."
            git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$LLAMA_DIR"
          fi

          cd "$LLAMA_DIR"

          echo "Fetching llama.cpp commit $COMMIT..."
          git fetch --depth 1 origin "$COMMIT"
          git checkout --detach "$COMMIT"

          echo "=================================================="
          echo "Building ONLY:"
          echo "  iOS Device / iPhoneOS / arm64"
          echo "NOT building:"
          echo "  iOS Simulator"
          echo "  macOS"
          echo "  visionOS"
          echo "  tvOS"
          echo "=================================================="

          chmod +x ./build-xcframework.sh

          # IMPORTANT:
          # The upstream script accepts explicit build names.
          # Passing ios-device prevents its default "build everything"
          # behavior and produces an XCFramework containing only the
          # real iPhone/iPad device slice.
          ./build-xcframework.sh ios-device

          XCFW="$LLAMA_DIR/build-apple/llama.xcframework"

          test -d "$XCFW"

          echo "=== XCFramework contents ==="
          find "$XCFW" -maxdepth 3 -type f -print

          echo "=== XCFramework Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$XCFW/Info.plist" || true

          # Confirm that the produced binary is iPhoneOS arm64.
          BIN="$XCFW/ios-arm64/llama.framework/llama"
          test -f "$BIN"

          echo "=== Binary architecture/platform ==="
          file "$BIN"
          xcrun vtool -show-build "$BIN" || true

          # Copy the final framework into a clean artifact directory.
          rm -rf "$ROOT/build"
          mkdir -p "$ROOT/build"

          cp -R "$XCFW" "$ROOT/build/llama.xcframework"

          # A ZIP is much easier to download from Codemagic and then unpack
          # into the GitHub repository's Vendor/ directory.
          cd "$ROOT/build"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "llama.xcframework" \
            "llama-ios-device-xcframework.zip"

          echo "=== Final artifact ==="
          ls -lh "$ROOT/build/llama-ios-device-xcframework.zip"

      - name: Verify only iOS device slice exists
        script: |
          set -euo pipefail

          XCFW="$CM_BUILD_DIR/build/llama.xcframework"

          echo "Available XCFramework slices:"
          find "$XCFW" -maxdepth 1 -mindepth 1 -type d -print | sort

          # Device-only build must not contain simulator/macOS/visionOS/tvOS
          # slices.
          if find "$XCFW" -maxdepth 1 -type d \
              \( -name '*simulator*' -o -name 'macos*' -o -name 'xros*' -o -name 'tvos*' \) \
              | grep -q .; then
            echo "ERROR: unexpected non-iOS-device slice found."
            exit 1
          fi

          test -d "$XCFW/ios-arm64"
          test ! -d "$XCFW/ios-arm64_x86_64-simulator"

          echo "OK: llama.xcframework contains iOS device only."

    artifacts:
      - build/llama-ios-device-xcframework.zip
      - build/llama.xcframework
